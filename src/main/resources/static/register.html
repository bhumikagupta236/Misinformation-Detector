<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register – Trust Guide Misinformation Detector</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Top Header -->
    <header class="site-header">
        <div class="container header-content">
            <a href="index.html" class="brand-link">
                <div class="shield-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                        <path d="M9 12l2 2 4-4"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="app-title">Trust Guide</h1>
                    <p class="app-tagline">Think before you trust.</p>
                </div>
            </a>
            <nav id="headerNav" class="nav-links">
                <a href="index.html" class="nav-link">Home</a>
                <a href="login.html" class="nav-link">Login</a>
                <a href="register.html" class="btn btn-primary btn-sm">Register</a>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container main-content">
        <div class="auth-container">
            <div id="feedbackBanner" class="feedback-banner hidden" role="alert"></div>

            <section class="card auth-card" aria-labelledby="registerHeading">
                <div class="card-header">
                    <h2 id="registerHeading">Create an Account</h2>
                    <p class="section-subtitle">Sign up to get personalized misinformation analysis, save history, and view analytics.</p>
                </div>

                <form id="registerForm" novalidate>
                    <div class="form-group">
                        <label for="fullNameInput" class="form-label">Full Name</label>
                        <input
                            type="text"
                            id="fullNameInput"
                            class="form-input"
                            placeholder="John Doe"
                            required
                            autocomplete="name"
                        >
                    </div>

                    <div class="form-group">
                        <label for="emailInput" class="form-label">Email Address</label>
                        <input
                            type="email"
                            id="emailInput"
                            class="form-input"
                            placeholder="name@example.com"
                            required
                            autocomplete="email"
                        >
                    </div>

                    <div class="form-group">
                        <label for="passwordInput" class="form-label">Password</label>
                        <input
                            type="password"
                            id="passwordInput"
                            class="form-input"
                            placeholder="Minimum 6 characters"
                            required
                            autocomplete="new-password"
                        >
                    </div>

                    <div class="form-group">
                        <label for="confirmPasswordInput" class="form-label">Confirm Password</label>
                        <input
                            type="password"
                            id="confirmPasswordInput"
                            class="form-input"
                            placeholder="Re-enter your password"
                            required
                            autocomplete="new-password"
                        >
                    </div>

                    <div class="form-actions" style="margin-top: 24px;">
                        <button type="submit" id="registerBtn" class="btn btn-primary" style="width: 100%;">
                            <span id="registerBtnText">Register Account</span>
                            <span id="registerSpinner" class="spinner hidden" aria-hidden="true"></span>
                        </button>
                    </div>
                </form>

                <div class="auth-footer">
                    Already have an account? <a href="login.html">Log in here</a>
                </div>
            </section>
        </div>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="container">
            <p>Trust Guide – Misinformation Detector &bull; Built with Java, Spring Boot &amp; SQL Database</p>
        </div>
    </footer>

    <script src="auth.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            // If already logged in, redirect to dashboard
            await initAuth({ redirectIfLoggedIn: true });

            const form = document.getElementById("registerForm");
            const fullNameInput = document.getElementById("fullNameInput");
            const emailInput = document.getElementById("emailInput");
            const passwordInput = document.getElementById("passwordInput");
            const confirmPasswordInput = document.getElementById("confirmPasswordInput");
            const registerBtn = document.getElementById("registerBtn");
            const registerBtnText = document.getElementById("registerBtnText");
            const registerSpinner = document.getElementById("registerSpinner");
            const feedbackBanner = document.getElementById("feedbackBanner");

            form.addEventListener("submit", async (e) => {
                e.preventDefault();
                hideFeedback();

                const fullName = fullNameInput.value.trim();
                const email = emailInput.value.trim();
                const password = passwordInput.value;
                const confirmPassword = confirmPasswordInput.value;

                if (!fullName) {
                    showFeedback("Please enter your full name.", "error");
                    fullNameInput.focus();
                    return;
                }
                if (!email) {
                    showFeedback("Please enter your email address.", "error");
                    emailInput.focus();
                    return;
                }
                if (!password || password.length < 6) {
                    showFeedback("Password must be at least 6 characters long.", "error");
                    passwordInput.focus();
                    return;
                }
                if (password !== confirmPassword) {
                    showFeedback("Passwords do not match. Please check again.", "error");
                    confirmPasswordInput.focus();
                    return;
                }

                setLoading(true);

                try {
                    const response = await fetch("/api/auth/register", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ fullName, email, password, confirmPassword })
                    });
                    const data = await response.json();

                    if (!response.ok) {
                        showFeedback(data.error || "Registration failed.", "error");
                        return;
                    }

                    showFeedback(data.message || "Registration successful! Redirecting to login...", "success");
                    setTimeout(() => {
                        window.location.href = "login.html";
                    }, 1200);
                } catch (err) {
                    showFeedback("Unable to connect to the server. Please verify the backend is running.", "error");
                } finally {
                    setLoading(false);
                }
            });

            function setLoading(loading) {
                registerBtn.disabled = loading;
                if (loading) {
                    registerBtnText.textContent = "Creating Account...";
                    registerSpinner.classList.remove("hidden");
                } else {
                    registerBtnText.textContent = "Register Account";
                    registerSpinner.classList.add("hidden");
                }
            }

            function showFeedback(msg, type) {
                feedbackBanner.textContent = msg;
                feedbackBanner.className = "feedback-banner " + (type === "success" ? "feedback-success" : "feedback-error");
                feedbackBanner.classList.remove("hidden");
            }

            function hideFeedback() {
                feedbackBanner.classList.add("hidden");
                feedbackBanner.textContent = "";
            }
        });
    </script>
</body>
</html>
