<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trust Guide – Misinformation Detector</title>
    <link rel="stylesheet" href="style.css">
    <script>
        // Automatic routing gateway:
        // If logged in -> opens Dashboard (Homepage).
        // If not logged in -> asks user to register first.
        (async function checkAndRedirect() {
            try {
                const response = await fetch("/api/auth/current-user");
                const data = await response.json();
                if (data && data.loggedIn) {
                    window.location.replace("dashboard.html");
                } else {
                    window.location.replace("register.html");
                }
            } catch (e) {
                window.location.replace("register.html");
            }
        })();
    </script>
</head>
<body>
    <header class="site-header">
        <div class="container header-content">
            <div class="brand">
                <div class="shield-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                        <path d="M9 12l2 2 4-4"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="app-title">Trust Guide</h1>
                    <p class="app-tagline">Think before you trust.</p>
                </div>
            </div>
            <nav class="nav-links">
                <a href="login.html" class="nav-link">Login</a>
                <a href="register.html" class="btn btn-primary btn-sm">Register</a>
            </nav>
        </div>
    </header>

    <main class="container main-content" style="text-align: center; padding-top: 60px;">
        <div class="card auth-container" style="max-width: 520px; margin: 0 auto; padding: 40px 30px;">
            <div class="shield-icon" style="margin: 0 auto 16px; width: 56px; height: 56px;">
                <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                    <path d="M9 12l2 2 4-4"></path>
                </svg>
            </div>
            <h2 style="font-size: 1.4rem; color: var(--text-primary); margin-bottom: 8px;">Welcome to Trust Guide</h2>
            <p style="color: var(--text-secondary); margin-bottom: 24px; font-size: 0.95rem;">
                Please register to create an account or log in if you are already registered.
            </p>
            <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
                <a href="register.html" class="btn btn-primary" style="flex: 1; min-width: 140px;">
                    Register Now
                </a>
                <a href="login.html" class="btn btn-secondary" style="flex: 1; min-width: 140px;">
                    Log In
                </a>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>Trust Guide – Misinformation Detector &bull; Built with Java, Spring Boot &amp; SQL Database</p>
        </div>
    </footer>
</body>
</html>
