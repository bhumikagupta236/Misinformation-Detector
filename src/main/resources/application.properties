# ============================================================
# Trust Guide – Misinformation Detector
# Spring Boot & Database Configuration
# ============================================================

spring.application.name=trust-guide
server.port=8080

# Ready-to-run Persistent SQL Database (MySQL Compatibility Mode stored in ./data/trust_guide)
# To switch to an external MySQL Server on port 3306, set the DB_URL, DB_DRIVER, DB_USERNAME, and DB_PASSWORD environment variables.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/trust_guide;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Example External MySQL Server settings (uncomment if running standalone MySQL Server on port 3306):
# spring.datasource.url=jdbc:mysql://localhost:3306/trust_guide?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=YOUR_MYSQL_PASSWORD

# Spring Data JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Prevent raw Java stack traces from being sent to the browser
server.error.include-stacktrace=never
server.error.include-message=always
